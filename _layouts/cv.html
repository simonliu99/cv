<!doctype html>
<html lang="en">
<head>
  <meta charset=utf-8 />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> {% if page.title %} {{ page.title }} | {% endif %} Simon Liu</title>
  <link href="media/{{ site.style }}-screen.css?v={{ site.time | date: '%s' }}" type="text/css" rel="stylesheet" media="screen">
  <link href="media/{{ site.style }}-print.css?v={{ site.time | date: '%s' }}" type="text/css" rel="stylesheet" media="print">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">

<script defer src="https://analytics.simonliu.dev/bonk" data-website-id="01c63daa-68c7-43e3-a5e8-564068ef0de7"></script>

</head>
<body>
  <div id="main">
    <div id="content">
    {{ content }}
    </div>
  </div>
  <script>
    document.querySelectorAll('#content a[href]').forEach(function(link) {
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || href.indexOf('mailto:') === 0) {
        return;
      }
      link.setAttribute('target', '_blank');
      link.setAttribute('rel', 'noopener noreferrer');
    });

    // Safari ignores break-after: avoid, so print keeps each heading with the
    // entry below it, and each entry with its detail list, in one unbreakable box.
    function holdsNext(element, grouping) {
      var next = element.nextElementSibling;
      if (!next) {
        return false;
      }
      if (/^H[2-4]$/.test(element.tagName)) {
        return true;
      }
      if (element.tagName !== 'P') {
        return false;
      }
      if (next.tagName === 'UL') {
        return true;
      }
      // A note between a heading and its first entry, such as a legend.
      return grouping && !element.querySelector('code') && !/^H[12]$/.test(next.tagName);
    }

    window.addEventListener('beforeprint', function() {
      var content = document.getElementById('content');
      var group = [];
      Array.prototype.slice.call(content.children).forEach(function(element) {
        var grouping = group.length > 0;
        group.push(element);
        if (holdsNext(element, grouping)) {
          return;
        }
        if (group.length > 1) {
          var box = document.createElement('div');
          box.className = 'cv-print-group';
          content.insertBefore(box, group[0]);
          group.forEach(function(member) {
            box.appendChild(member);
          });
        }
        group = [];
      });
    });

    window.addEventListener('afterprint', function() {
      document.querySelectorAll('#content > .cv-print-group').forEach(function(box) {
        while (box.firstChild) {
          box.parentNode.insertBefore(box.firstChild, box);
        }
        box.parentNode.removeChild(box);
      });
    });
  </script>
</body>
</html>
